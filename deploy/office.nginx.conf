server {
    listen 80;
    server_name office.laisengou.com;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/office.laisengou.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://office.laisengou.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name office.laisengou.com;
    ssl_certificate /opt/office.laisengou.com/tls/config/live/office.laisengou.com/fullchain.pem;
    ssl_certificate_key /opt/office.laisengou.com/tls/config/live/office.laisengou.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 12M;
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }
}
