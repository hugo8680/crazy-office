<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>设置密码 · 疯狂办公室</title>
  <link rel="stylesheet" href="/join.css">
  <script src="/join.js" defer></script>
</head>
<body>
  <main class="entry">
    <a class="brand" href="/login" aria-label="疯狂办公室登录">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2"/><rect x="19" y="3" width="10" height="10" rx="2"/><rect x="3" y="19" width="10" height="10" rx="2"/><path d="M24 19v10m-5-5h10"/></svg>
      <span>疯狂办公室<small>OFFICE LAB</small></span>
    </a>
    <section class="password-panel" aria-labelledby="join-title">
      <span class="entry-label">员工账号</span>
      <h1 id="join-title">设置登录密码</h1>
      <p id="join-description" class="description">设置完成后，使用管理员分配的账号登录。</p>
      <form id="join-form" action="/api/erp/invitations/accept" method="post" novalidate>
        <label class="field" for="password"><span>新密码</span><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" aria-describedby="password-hint" required></label>
        <p id="password-hint" class="field-hint">至少 12 个字符。</p>
        <label class="field" for="password-confirm"><span>再次输入密码</span><input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label>
        <p id="join-error" class="message error" role="alert" hidden></p>
        <button id="join-button" type="submit"><span id="join-button-text">确认设置</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
      </form>
      <div id="join-result" class="result" role="status" aria-live="polite" hidden>
        <svg class="result-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"/><path d="m12 20 5 5 11-11"/></svg>
        <p id="join-result-text"></p>
      </div>
      <a id="login-link" class="login-link" href="/login">返回登录<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a>
    </section>
    <p class="footer">吉林云投莱森购数字科技有限公司</p>
  </main>
</body>
</html>
