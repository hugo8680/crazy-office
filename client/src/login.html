<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f5eb">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>登录 · 疯狂办公室</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="entry">
    <section class="office-preview" aria-label="疯狂办公室">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect x="3" y="4" width="11" height="11" rx="3"/><rect x="18" y="4" width="11" height="11" rx="3"/><rect x="3" y="19" width="11" height="9" rx="3"/><path d="M23.5 19v9M19 23.5h9"/></svg>
      </div>
      <p class="brand-caption">OFFICE LAB</p>
      <h1>疯狂办公室</h1>
      <p class="company">吉林云投莱森购数字科技有限公司</p>
      <div class="floor-plan" aria-hidden="true">
        <svg viewBox="0 0 410 240">
          <path class="floor-shadow" d="M22 46h366v172H22z"/>
          <path class="floor-base" d="M16 34h366v172H16z"/>
          <path class="room-sage" d="M23 41h195v103H23z"/>
          <path class="room-blue" d="M225 41h150v103H225z"/>
          <path class="room-cream" d="M23 160h195v39H23z"/>
          <path class="room-peach" d="M225 160h150v39H225z"/>
          <path class="walls" d="M16 34h366v172H16zM221 35v109m0 16v46M16 147h80m21 0h104m0 0h65m22 0h74M16 157h80m21 0h104m0 0h65m22 0h74"/>
          <path class="network-shadow" d="M66 76h105v81h130V99m-130 58v26m0-26H68v26M301 157v24"/>
          <path class="network" d="M66 76h105v81h130V99m-130 58v26m0-26H68v26M301 157v24"/>
          <g class="desk"><rect x="41" y="60" width="54" height="31" rx="6"/><rect x="140" y="60" width="54" height="31" rx="6"/><rect x="41" y="110" width="54" height="25" rx="6"/><rect x="140" y="110" width="54" height="25" rx="6"/></g>
          <g class="screen"><rect x="51" y="64" width="32" height="19" rx="3"/><rect x="150" y="64" width="32" height="19" rx="3"/><path d="M57 72h14m-14 5h20m79-5h14m-14 5h20"/></g>
          <g class="people"><circle cx="66" cy="97" r="8"/><path d="M56 111q0-12 10-12t10 12"/><circle cx="166" cy="97" r="8"/><path d="M156 111q0-12 10-12t10 12"/></g>
          <g class="servers"><rect x="263" y="61" width="31" height="63" rx="4"/><rect x="308" y="61" width="31" height="63" rx="4"/><path d="M269 75h18m-18 12h18m-18 12h18m27-24h18m-18 12h18m-18 12h18"/></g>
          <g class="status-lights"><circle cx="284" cy="111" r="2"/><circle cx="329" cy="111" r="2"/><circle cx="301" cy="157" r="4"/><circle cx="171" cy="157" r="4"/></g>
          <rect class="table" x="48" y="172" width="62" height="17" rx="8"/>
          <rect class="table" x="263" y="172" width="65" height="17" rx="8"/>
          <path class="plant-stem" d="M354 186v-20"/>
          <path class="plant-leaf" d="M354 174q-16-1-13-13 14 0 13 13m0 2q-1-15 12-16 3 12-12 16"/>
          <path class="plant-pot" d="M346 182h16l-3 11h-10z"/>
        </svg>
      </div>
      <div class="preview-footer" aria-hidden="true"><span class="status-dot"></span><span>LAISEN HORIZON</span><span class="floor-label">01 / OFFICE</span></div>
    </section>

    <section class="login-panel" aria-labelledby="login-title">
      <div class="form-heading"><span class="entry-label">工作空间</span><h2 id="login-title">登录办公室</h2></div>
      <form id="login-form" action="/api/session/login" method="post">
        <label class="field" for="username"><span>账号</span><input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80" required></label>
        <label class="field" for="password"><span>密码</span><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button id="login-button" type="submit"><span id="login-button-text">登录</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5"/></svg></button>
      </form>
    </section>
  </main>
</body>
</html>
