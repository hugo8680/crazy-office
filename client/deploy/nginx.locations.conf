# Shared locations for the HTTPS site. Server credentials remain in the Go process.
# This file belongs inside the office.laisengou.com server block.
location = /_office_session_check {
    internal;
    proxy_pass http://127.0.0.1:8080/api/session/check;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_cache off;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
}
location = /login { try_files /login.html =404; }
location = /login.html { try_files $uri =404; }
location = /join { try_files /join.html =404; }
location = /join.html { try_files $uri =404; }
location ~ /\. { deny all; }
location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|webp|gif|ico|woff|woff2|ttf|map)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
}
location = /asset-manifest.json { try_files $uri =404; }
location @office_login { return 302 /login; }
location / {
    auth_request /_office_session_check;
    error_page 401 = @office_login;
    try_files $uri $uri/ =404;
}
