# Shared locations for the HTTPS site. Server credentials remain in the Go process.
# This file belongs inside the office.laisengou.com server block.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
}
location = /login { return 302 /; }
location = /login.html { return 302 /; }
location = /join { try_files /index.html =404; }
location = /join.html { try_files /index.html =404; }
location ~ /\. { deny all; }
location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|webp|gif|ico|woff|woff2|ttf|map)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
}
location = /asset-manifest.json { try_files $uri =404; }
location / {
    # The office scene is a public shell. Every business API authenticates in Go.
    try_files $uri $uri/ =404;
}
