# Install only for office.laisengou.com after nginx -t succeeds.
# Static office shell only. Go authenticates every business API.
# Do not replace other virtual hosts.
server {
    listen 80;
    server_name office.laisengou.com;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/office.laisengou.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://office.laisengou.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name office.laisengou.com;
    ssl_certificate /opt/office.laisengou.com/tls/config/live/office.laisengou.com/fullchain.pem;
    ssl_certificate_key /opt/office.laisengou.com/tls/config/live/office.laisengou.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/office.laisengou.com/client/current;
    index index.html;
    include /etc/nginx/mime.types;
    types { text/javascript mjs; }
    client_max_body_size 12M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache";
    include /opt/office.laisengou.com/client/nginx.locations.conf;
}
